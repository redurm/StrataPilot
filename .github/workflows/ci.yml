name: CI

# What runs here, and what cannot:
#
#   * the unit tests (`npm test`) need nothing but Node - no Electron binary, no pi, no Strata -
#     so they run on all three platforms, which is also the only cross-platform signal this repo
#     has today (see docs/TODO.md C7: the app itself is developed and smoke-tested on Windows).
#   * the smoke scenarios (STRATAPILOT_SMOKE_*) need a real pi install. The ones that talk to a model
#     stay manual, but the model-independent ones run in CI under STRATAPILOT_SMOKE_SAFE (#47): they
#     drive the real UI against a real pi with no credentials, one scenario at a time, and
#     scripts/check-smoke-log.js reads the log and decides - a scenario that printed FAIL, or never
#     printed its line at all, fails the build. `smoke-rpc.js` checks the pi install without a model,
#     and the `electron smoke` job below starts a real window with no Strata server on Linux and macOS
#     - that is this repo's proof that the app itself runs outside Windows (docs/TODO.md C7).
#   * the Electron binary is downloaded only by the `electron smoke` job; the other jobs skip it
#     with ELECTRON_SKIP_BINARY_DOWNLOAD, which cuts minutes off every job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.19', '24.x'] # 22.19 is the floor package.json declares; latest is what people actually run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  syntax:
    name: syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      # the renderer files are plain browser scripts and the main-process files are CommonJS:
      # `node --check` catches the one kind of mistake a smoke run only shows as a blank window
      - name: node --check every source file
        shell: bash
        run: |
          set -e
          for f in main.js preload.js lib/*.js renderer/*.js test/*.js scripts/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      # no third-party linter (the app has zero runtime deps and the dev surface is deliberately
      # small), but the one bug class a linter would have caught - a block dedented to column 0 while
      # still inside another scope, which is what broke the smoke screenshot in #5 - is checked here
      - name: structural lint (dedented block starts)
        run: npm run lint

  pi-install:
    name: pi install smoke (${{ matrix.os }}, no model needed)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: install pi
        run: |
          curl -fsSL https://pi.dev/install.sh | sh || echo "pi install failed: the job below reports what it found"
      - name: report what the launcher resolves
        run: node test/smoke-rpc.js "$GITHUB_WORKSPACE" || true

  # C7: the app is developed on Windows, so the window itself is only ever seen on Windows. This
  # job starts it for real on Linux and macOS with no Strata server: the point is not the features,
  # it is that Electron opens, the main process spawns, the renderer boots without an error and the
  # env bar reports the pi it found. The macOS leg is allowed to fail (headless GUI on a CI runner
  # is flaky) but its log is the thing to read when someone reports "it does not start on macOS".
  electron-smoke:
    name: electron smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      - name: install the libraries Electron needs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: install pi
        run: |
          curl -fsSL https://pi.dev/install.sh | sh || echo "pi install failed on purpose: the app must still start and say pi ? in the env bar"
      - name: npm ci (with the Electron binary)
        run: npm ci
      - name: start the app with no Strata server and no model
        shell: bash
        env:
          STRATAPILOT_SMOKE: '1'
          STRATAPILOT_SMOKE_MS: '6000'
        run: |
          set -e
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a npx electron . --no-sandbox > smoke.log 2>&1 || true
          else
            npx electron . > smoke.log 2>&1 || true
          fi
          cat smoke.log
          # the markers have to be read back out of smoke.log: an `echo WINDOW_OK` lands in
          # this step's stdout, so grepping smoke.log for it could never match and the job
          # went red even when the app started fine. Report every problem at once.
          failed=0
          if grep -q "renderer error" smoke.log; then echo "RENDERER_ERROR"; failed=1; fi
          grep -q "\[smoke\] window" smoke.log || { echo "NO_WINDOW_LINE"; failed=1; }
          grep -q "\[smoke-env\]" smoke.log || { echo "NO_ENVBAR_LINE"; failed=1; }
          [ "$failed" = 0 ] && echo "WINDOW_OK ENVBAR_OK"
          exit $failed

  # #47: the model-independent scenarios, on the two platforms this repo actually ships and breaks on.
  # They drive the real UI against a real pi with no credentials and no model call, one at a time, and
  # quit the app when every one of them has reported. The checker then fails the build when a scenario
  # printed FAIL, threw, finished without printing its line, or when the tally is missing entirely -
  # which is how a run that ended early used to look exactly like a pass.
  smoke-scenarios:
    name: smoke scenarios (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      - name: install the libraries Electron needs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: install pi pinned to the version this GUI is tested against
        shell: bash
        run: |
          # the managed installer (https://pi.dev/install.sh) covers macOS and Linux only, and it
          # tracks its own channel - a scenario run would mean something different on each platform,
          # and would move under us when pi releases. The scenarios want the version lib/pi-launch.js
          # calls TESTED_PI_VERSION, resolved through STRATAPILOT_PI_CLI so nothing is guessed. The CLI
          # path comes from the package's own bin field: the global node_modules sits under lib/ on
          # Linux and directly under the prefix on Windows, so deriving it from npm prefix -g is wrong.
          set -e
          VERSION=$(node -e "process.stdout.write(require('./lib/pi-launch').TESTED_PI_VERSION)")
          npm install -g "@earendil-works/pi-coding-agent@$VERSION"
          ROOT=$(npm root -g)
          PKG="$ROOT/@earendil-works/pi-coding-agent"
          CLI=$(node -e 'const path=require("path");const dir=process.argv[1];const pkg=require(path.join(dir,"package.json"));const bin=typeof pkg.bin==="string"?pkg.bin:pkg.bin.pi;process.stdout.write(path.join(dir,bin))' "$PKG")
          test -f "$CLI" || { echo "pi cli not found at $CLI"; exit 1; }
          echo "STRATAPILOT_PI_CLI=$CLI" >> "$GITHUB_ENV"
          node "$CLI" --version || true
      - name: npm ci (with the Electron binary)
        run: npm ci
      - name: run every scenario that needs no model
        shell: bash
        env:
          STRATAPILOT_SMOKE: '1'
          STRATAPILOT_SMOKE_SAFE: '1'
          # a backstop, not the finish line: the queue quits the app once every scenario reported. If a
          # scenario hangs, this window closes and the tally line is missing, which the checker fails.
          STRATAPILOT_SMOKE_MS: '300000'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a npx electron . --no-sandbox > smoke.log 2>&1 || true
          else
            npx electron . > smoke.log 2>&1 || true
          fi
          cat smoke.log
      - name: decide pass or fail from the log
        run: node scripts/check-smoke-log.js smoke.log --safe
      - name: upload the log when it went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}
          path: smoke.log
