name: Release build

# C5: packaging. `npm run dist` (electron-builder) produces
#
#   Windows : stratapilot-<version>-win-x64-setup.exe (NSIS, per-user, install folder choosable)
#             stratapilot-<version>-win-x64.zip       (the unpacked folder - a portable install:
#                                                        unzip it anywhere and run "StrataPilot.exe")
#   macOS   : .dmg and .zip
#   Linux   : .AppImage and .deb
#
# Nothing is code-signed: there is no certificate in this repo, so Windows SmartScreen and macOS
# Gatekeeper will warn on first launch. The artifacts are uploaded per OS, so a build that fails on
# one platform does not hide the others.
#
# Run it by hand from the Actions tab (Run workflow), or push a tag like v0.2.0.
#
# --publish never is not decoration: on a tag push electron-builder v26 starts an implicit GitHub
# Release publish, and without GH_TOKEN that fails AFTER every artifact has been built - the step then
# exits 1, upload-artifact never runs, and the release ends up with nothing to download (#38).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: unit tests before packaging
        run: npm test
      - name: build (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish never
      - name: build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --x64 --publish never
      - name: build (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: what came out
        shell: bash
        run: ls -la dist
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stratapilot-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # A tag with no Release page is a release nobody can download: the artifacts above live under the
  # Actions run, need a GitHub login to fetch, and expire after 30 days (#41). electron-builder's own
  # publish is disabled on purpose (#38 - it needs a token and fails after everything is built), so the
  # workflow does the publishing itself with the token GitHub already gives the job.
  publish-release:
    name: publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stratapilot-*
          path: dist
          merge-multiple: true
      - name: release notes come from the CHANGELOG
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
      - name: create or top up the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/*.exe dist/*.zip dist/*.dmg dist/*.AppImage dist/*.deb)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a re-run on the same tag must not fail: replace the assets instead
            gh release upload --clobber "$GITHUB_REF_NAME" "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"               --notes-file dist/RELEASE_NOTES.md "${files[@]}"
          fi
          gh release view "$GITHUB_REF_NAME"

  # A packaged build that never starts is worse than no build, so the Windows artifact is launched
  # here in smoke mode (no Strata server, no model) before anyone can download it.
  smoke-windows-artifact:
    name: smoke the packaged app (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stratapilot-windows-latest
          path: artifact
      - name: unzip the portable build and start it
        shell: bash
        env:
          STRATAPILOT_SMOKE: '1'
          STRATAPILOT_SMOKE_MS: '7000'
        run: |
          set -e
          7z x -y -odist artifact/stratapilot-*-win-x64.zip > /dev/null
          "./dist/StrataPilot.exe" > smoke.log 2>&1 || true
          cat smoke.log
          grep -q "\[smoke\] window" smoke.log
          grep -q "renderer error" smoke.log && { echo "RENDERER_ERROR"; exit 1; }
          echo "PACKAGED_APP_STARTS"
