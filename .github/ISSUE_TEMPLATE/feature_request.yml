name: Feature request
description: Something the GUI should do that it does not do yet
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Check the backlog in `docs/TODO.md` first — most obvious ideas are already listed there with
        an effort and priority, and the "Deliberately not doing" table at the end explains what is
        out of scope on purpose (pi RPC mode simply cannot do some of it).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: the workflow that is missing, not the UI you imagine
      placeholder: |
        I keep re-running the same three prompts every morning before standup.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead
      description: the workaround, and why it is not good enough
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work
      description: keep it short; half a page is plenty
  - type: textarea
    id: rpc
    attributes:
      label: Does pi already have an RPC command for it?
      description: >
        This GUI only ever talks to `pi --mode rpc`. If you know the command name
        (`set_auto_retry`, `get_tree`, `fork`, …) put it here — it usually decides how small the
        change is. See the pi docs `rpc-commands.md`.
